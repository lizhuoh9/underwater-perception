[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwslam"
version = "0.1.0"
description = "Monocular-camera SLAM for a small underwater robot: a C core that runs bit-identically on a PC and an ESP32-P4, checked against a reconstruction of a lake clip"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9.1"]

[project.optional-dependencies]
experiments = ["opencv-python-headless>=4.8", "torch>=2.0", "esp-ppq>=1.3"]
board = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# E501: the formatter wraps code to the line length; long strings and URLs stay whole. B905: the zips pair sequences of
# equal length by construction. B023: the plotting and report helpers that read a loop variable are called within the
# same iteration.
ignore = ["E501", "B905", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["uwslam"]
